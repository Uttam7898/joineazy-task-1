services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joineazy
      POSTGRES_PASSWORD: joineazy
      POSTGRES_DB: joineazy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: joineazy
      POSTGRES_PASSWORD: joineazy
      POSTGRES_DB: joineazy
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: joineazy-dev-secret-change-me
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
